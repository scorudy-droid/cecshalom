<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Captura de Código y Foto</title>
</head>
<body>

    <h2>Registro de Código</h2>
    
    <!-- Video oculto o visible (puedes usar style="display:none;" si quieres que sea secreto) -->
    <video id="video" width="320" height="240" autoplay style="border: 1px solid #ccc;"></video>
    <canvas id="canvas" width="320" height="240" style="display:none;"></canvas>

    <form id="formCodigo" action="guardar_foto.asp" method="post">
        <label for="codigo">Ingrese el Código:</label>
        <input type="text" id="codigo" name="codigo" required autocomplete="off">
        
        <!-- Aquí se guardará la foto en Base64 antes de enviar -->
        <input type="hidden" id="fotoBase64" name="fotoBase64">
        
        <button type="submit">Enviar</button>
    </form>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const form = document.getElementById('formCodigo');
        const fotoInput = document.getElementById('fotoBase64');

        // 1. Iniciar la cámara web al cargar la página
        navigator.mediaDevices.getUserMedia({ video: true, audio: false })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                console.error("Error al acceder a la cámara: ", err);
                alert("Se requieren permisos de cámara para usar este módulo.");
            });

        // 2. Interceptar el envío del formulario para tomar la foto
        form.addEventListener('submit', function(e) {
            e.preventDefault(); // Detener envío momentáneamente

            // Dibujar el frame actual del video en el canvas oculto
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, 320, 240);

            // Convertir el contenido del canvas a texto Base64 (formato JPEG)
            const dataURL = canvas.toDataURL('image/jpeg');
            
            // Asignar el string Base64 al campo oculto
            fotoInput.value = dataURL;

            // Procesar el envío real del formulario
            this.submit();
        });
    </script>
</body>
</html>
